name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: triagegpt
  CLUSTER_NAME: triagegpt
  NAMESPACE: triagegpt

jobs:
  iac:
    name: Terraform + manifest checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: terraform validate
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
      - name: Checkov (Terraform, Kubernetes, Dockerfile)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,kubernetes,dockerfile
          config_file: .checkov.yaml

  image:
    name: Build and scan image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency audit (pip-audit)
        run: |
          pipx run pip-audit -r requirements-app.txt --strict
      - name: Build
        run: docker build -t triagegpt:ci .
      - name: Smoke test (container starts and serves health check)
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp -p 8501:8501 triagegpt:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8501/_stcore/health && exit 0
            sleep 2
          done
          docker logs smoke
          exit 1
      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: triagegpt:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # Accepted finding: OWASP Juice Shop's intentionally hard-coded, publicly published RSA key.
          # It is part of the SAST test corpus the app triages, not a credential. Scoped to this one file;
          # secret scanning stays on for everything else.
          skip-files: "app/data/juice-shop-src/lib/insecurity.ts,/app/data/juice-shop-src/lib/insecurity.ts"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: triagegpt:ci
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  publish-and-deploy:
    name: Push to ECR, sign, deploy to EKS
    needs: [iac, image]
    if: github.ref == 'refs/heads/main' && vars.AWS_CI_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC to AWS, and keyless cosign signing
    steps:
      - uses: actions/checkout@v4
      - name: AWS credentials via GitHub OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push (tag = commit SHA; tags are immutable in ECR)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign image by digest (keyless, Sigstore)
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - name: Roll out the new digest
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.push.outputs.digest }}
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"
          kubectl -n "$NAMESPACE" set image deployment/triagegpt app="$IMAGE"
          kubectl -n "$NAMESPACE" rollout status deployment/triagegpt --timeout=180s
