# Pulls the API keys from AWS Secrets Manager into a Kubernetes Secret.
# External Secrets Operator authenticates with EKS Pod Identity (see infra/terraform/secrets.tf),
# so no AWS credentials exist anywhere in this namespace.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: triagegpt
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1 # keep in sync with var.region
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-keys
  namespace: triagegpt
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: triagegpt-api-keys
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: triagegpt/api-keys # JSON: {"ANTHROPIC_API_KEY": "...", "GEMINI_API_KEY": "..."}
